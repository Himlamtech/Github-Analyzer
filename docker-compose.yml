name: gha

networks:
  github-networks:
    driver: bridge

volumes:
  kafka_data:
    name: github-kafka-data
  clickhouse_data:
    external: true
    name: github-clickhouse-data
  prometheus_data:
    external: true
    name: github-prometheus-data
  grafana_data:
    external: true
    name: github-grafana-data

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: github-zookeeper
    hostname: zookeeper
    networks:
      - github-networks
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | timeout 2 bash -c 'cat > /dev/tcp/localhost/2181' && echo imok || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: github-kafka
    hostname: kafka
    networks:
      - github-networks
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_JMX_HOST_PORT:-9101}:9101"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 16
      KAFKA_MESSAGE_MAX_BYTES: 52428800
      KAFKA_REPLICA_FETCH_MAX_BYTES: 52428800
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: github-clickhouse
    hostname: clickhouse
    networks:
      - github-networks
    ports:
      - "${CLICKHOUSE_PUBLIC_BIND_IP:-0.0.0.0}:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_PUBLIC_BIND_IP:-0.0.0.0}:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-github_analyzer}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-github_analyzer}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-github_analyzer}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: github-prometheus
    hostname: prometheus
    networks:
      - github-networks
    ports:
      - "${PROMETHEUS_PORT:-9093}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: github-grafana
    hostname: grafana
    networks:
      - github-networks
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana_provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: warn
      GF_METRICS_ENABLED: "true"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    depends_on:
      - prometheus
    restart: unless-stopped

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
    container_name: github-dcgm-exporter
    hostname: dcgm-exporter
    profiles: ["gpu"]
    networks:
      - github-networks
    environment:
      DCGM_EXPORTER_LISTEN: ":9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    image: gha-frontend
    container_name: github-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    hostname: frontend
    networks:
      - github-networks
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode < 400 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    image: gha-api
    container_name: github-api
    build:
      context: .
      dockerfile: Dockerfile
    hostname: api
    networks:
      - github-networks
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:ro
    environment:
      GITHUB_API_TOKENS: ${GITHUB_API_TOKENS}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-github_analyzer}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-github_analyzer}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-github_analyzer}
      PARQUET_BASE_PATH: /app/data/raw
      REPO_METADATA_PATH: /app/data/repos
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRACING_ENABLED: "false"
      TRACING_SERVICE_NAME: ${TRACING_SERVICE_NAME:-gha-api}
      TRACING_SAMPLING_RATIO: ${TRACING_SAMPLING_RATIO:-1.0}
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode() < 400 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  poller:
    image: gha-poller
    container_name: github-poller
    build:
      context: .
      dockerfile: Dockerfile
    hostname: poller
    command: ["python", "-m", "src.application.use_cases.poll_github_events"]
    networks:
      - github-networks
    environment:
      GITHUB_API_TOKENS: ${GITHUB_API_TOKENS}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: github_raw_events
      KAFKA_RETENTION_HOURS: 168
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-github_analyzer}
      METRICS_PORT: 9091
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  processor:
    image: gha-processor
    container_name: github-processor
    build:
      context: .
      dockerfile: Dockerfile
    hostname: processor
    command: ["python", "-m", "src.application.use_cases.process_event_stream"]
    networks:
      - github-networks
    volumes:
      - ./data:/app/data
    environment:
      GITHUB_API_TOKENS: ${GITHUB_API_TOKENS}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: github_raw_events
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-github_analyzer}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-github_analyzer}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-github_analyzer}
      PARQUET_BASE_PATH: /app/data/raw
      CHECKPOINT_BASE_PATH: /app/data/checkpoints
      SPARK_MASTER: local[4]
      SPARK_DRIVER_MEMORY: 2g
      SPARK_EXECUTOR_MEMORY: 2g
      METRICS_PORT: 9091
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
