name: gha

networks:
  github-networks:
    driver: bridge

volumes:
  kafka_data:
    name: github-kafka-data
  frontend_node_modules:
    name: github-frontend-node-modules
  frontend_vite_cache:
    name: github-frontend-vite-cache
  clickhouse_data:
    external: true
    name: github-clickhouse-data

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: github-zookeeper
    hostname: zookeeper
    networks:
      - github-networks
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | timeout 2 bash -c 'cat > /dev/tcp/localhost/2181' && echo imok || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: github-kafka
    hostname: kafka
    networks:
      - github-networks
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_JMX_HOST_PORT:-9101}:9101"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 16
      KAFKA_MESSAGE_MAX_BYTES: 52428800
      KAFKA_REPLICA_FETCH_MAX_BYTES: 52428800
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: github-clickhouse
    hostname: clickhouse
    networks:
      - github-networks
    ports:
      - "${CLICKHOUSE_PUBLIC_BIND_IP:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_PUBLIC_BIND_IP:-127.0.0.1}:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-github_analyzer}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-github_analyzer}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-github_analyzer}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: gha-frontend
    container_name: github-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command:
      ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    hostname: frontend
    networks:
      - github-networks
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_vite_cache:/app/node_modules/.vite
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode < 400 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    image: gha-api
    container_name: github-api
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "src.presentation.api.routes:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/src",
      ]
    hostname: api
    networks:
      - github-networks
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data:ro
    environment:
      GITHUB_API_TOKENS: ${GITHUB_API_TOKENS}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-github_analyzer}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-github_analyzer}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-github_analyzer}
      PARQUET_BASE_PATH: /app/data/raw
      REPO_METADATA_PATH: /app/data/repos
      NEWS_INTELLIGENCE_MODE: ${NEWS_INTELLIGENCE_MODE:-curated}
      NEWS_INTELLIGENCE_SYNC_ENABLED: ${NEWS_INTELLIGENCE_SYNC_ENABLED:-false}
      NEWS_INTELLIGENCE_SOURCES: ${NEWS_INTELLIGENCE_SOURCES:-[]}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode() < 400 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  poller:
    image: gha-poller
    container_name: github-poller
    build:
      context: .
      dockerfile: Dockerfile
    hostname: poller
    command: ["uv", "run", "python", "-m", "src.application.use_cases.poll_github_events"]
    networks:
      - github-networks
    volumes:
      - ./src:/app/src
    environment:
      GITHUB_API_TOKENS: ${GITHUB_API_TOKENS}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: github_raw_events
      KAFKA_RETENTION_HOURS: 168
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-github_analyzer}
      METRICS_PORT: 9091
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  processor:
    image: gha-processor
    container_name: github-processor
    build:
      context: .
      dockerfile: Dockerfile
    hostname: processor
    command: ["python", "-m", "src.application.use_cases.process_event_stream"]
    networks:
      - github-networks
    volumes:
      - ./data:/app/data
    environment:
      GITHUB_API_TOKENS: ${GITHUB_API_TOKENS}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: github_raw_events
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-github_analyzer}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-github_analyzer}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-github_analyzer}
      PARQUET_BASE_PATH: /app/data/raw
      CHECKPOINT_BASE_PATH: /app/data/checkpoints
      SPARK_MASTER: local[4]
      SPARK_DRIVER_MEMORY: 2g
      SPARK_EXECUTOR_MEMORY: 2g
      METRICS_PORT: 9091
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
